    <!-- 主题在渲染前同步确定，避免刷新闪烁 -->
    <script>
        (function () {
            try {
                var saved = localStorage.getItem('docsify-theme');
                var dark = saved
                    ? saved === 'dark'
                    : window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>

    <script>
        var themeToggle = document.getElementById('theme-toggle');
        // 根据当前 data-theme 同步 aria-pressed，让屏幕阅读器知道是否处于暗黑模式
        function syncThemeToggle() {
            var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            themeToggle.setAttribute('aria-pressed', isDark ? 'true' : 'false');
        }
        syncThemeToggle();
        themeToggle.addEventListener('click', function () {
            var root = document.documentElement;
            var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            root.setAttribute('data-theme', next);
            try { localStorage.setItem('docsify-theme', next); } catch (e) { }
            syncThemeToggle();
        });
        // 记住侧边栏收起/展开状态（.sidebar-toggle 由 docsify 动态生成，用事件委托）
        document.addEventListener('click', function (e) {
            if (window.innerWidth > 768 && e.target.closest && e.target.closest('.sidebar-toggle')) {
                setTimeout(function () {
                    try {
                        localStorage.setItem('goac-sidebar', document.body.classList.contains('close') ? 'close' : 'open');
                    } catch (err) { }
                }, 50);
            }
        });
    </script>
